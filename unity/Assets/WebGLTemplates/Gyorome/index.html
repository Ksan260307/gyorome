<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <meta name="description" content="画面いっぱいの目玉ふたつが、ぎょろぎょろ動く。タップ・スワイプ・長押し・ふる・かたむける で 100 しゅ以上の反応。スマホ・タブレットでも。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="ぎょろめ — Gyorome">
  <meta property="og:description" content="目玉ふたつをつついて、なでて、ふってみよう。100 しゅ以上の反応を見つける、ちいさなおもちゃ。">
  <meta property="og:image" content="icon.png">
  <meta name="theme-color" content="#ffd670">
  <title>ぎょろめ — Gyorome</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #ffd670;
      overscroll-behavior: none;
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #unity-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #ffd670; outline: none; touch-action: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px;
      background: radial-gradient(ellipse at 50% 40%, #fff1c9 0%, #ffd670 70%);
      color: #4a3a1e; transition: opacity .8s ease; z-index: 2;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .eyes { display: flex; gap: 18px; }
    .eye { width: 84px; height: 84px; border-radius: 50%; background: #fffdf8; border: 5px solid #4a3a1e; position: relative; box-shadow: 0 10px 24px rgba(90,60,10,.25); overflow: hidden; }
    .eye::after { content: ""; position: absolute; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #8fc4f0 0%, #3f7ac6 55%, #1b3c6e 100%); left: 23px; top: 23px; box-shadow: inset 0 0 0 11px rgba(10,10,20,.0); animation: look 2.6s ease-in-out infinite; }
    .eye::before { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #16141c; left: 32px; top: 32px; z-index: 1; animation: look 2.6s ease-in-out infinite; }
    .eye .lid { position: absolute; left: -6px; right: -6px; top: -90%; height: 100%; background: #ffd670; border-bottom: 5px solid #4a3a1e; z-index: 2; animation: blink 3.4s ease-in-out infinite; }
    @keyframes look { 0%, 35% { transform: translate(0, 0); } 45%, 60% { transform: translate(12px, -4px); } 70%, 100% { transform: translate(0, 0); } }
    @keyframes blink { 0%, 90%, 100% { top: -90%; } 94% { top: 0%; } }
    #loading h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); letter-spacing: .25em; font-weight: 800; }
    #loading .sub { margin-top: -14px; font-size: 13px; letter-spacing: .5em; color: #8a6a2a; opacity: .9; }
    #bar { width: min(420px, 70vw); height: 10px; border-radius: 6px; background: rgba(74,58,30,.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #3f7ac6, #8fc4f0); transition: width .2s; }
    #tip { font-size: 14px; color: #6a5230; min-height: 1.4em; text-align: center; padding: 0 20px; }
    #pct { margin-top: -12px; font-size: 13px; color: #8a6a2a; letter-spacing: .1em; }
    #error button { margin-left: 12px; padding: 6px 14px; border-radius: 14px; border: 2px solid #c79a5a; background: #f6cd6e; color: #4a3014; font-weight: 700; cursor: pointer; }
    #error { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #fff6e6; color: #6a3a2a; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 3; max-width: 80vw; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div class="eyes"><div class="eye"><div class="lid"></div></div><div class="eye"><div class="lid"></div></div></div>
    <h1>ぎょろめ</h1>
    <div class="sub">GYOROME</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="pct">0%</div>
    <div id="tip">目をタップしてみよう</div>
  </div>
  <div id="error"></div>
  <noscript><p style="color:#4a3a1e;text-align:center;margin-top:40vh">このゲームを遊ぶには JavaScript を有効にしてください。</p></noscript>
  <script>
    const tips = [
      "目をタップしてみよう",
      "ゆっくりなでると、よろこぶ",
      "長押しすると、むぎゅっとなる",
      "2 本の指でひろげたり、せばめたり",
      "スマホなら、ふったり かたむけたりしてみて",
      "しばらく何もしないと、ねむってしまう",
      "右上の本のボタンで、見つけた反応がわかる",
      "反応は 100 しゅ以上。ぜんぶ見つけられる？",
    ];
    let tipIndex = 0;
    const tipEl = document.getElementById("tip");
    const tipTimer = setInterval(() => { tipIndex = (tipIndex + 1) % tips.length; tipEl.textContent = tips[tipIndex]; }, 3200);

    const canvas = document.getElementById("unity-canvas");
    const fill = document.getElementById("fill");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const pct = document.getElementById("pct");

    function unityShowBanner(msg, type) {
      if (type === "error") showError(msg);
      else console.log(msg);
    }

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
      const retry = document.createElement("button");
      retry.textContent = "もう一度読み込む";
      retry.onclick = () => location.reload();
      errorBox.appendChild(retry);
    }

    if (!document.createElement("canvas").getContext("webgl2")) {
      showError("このブラウザでは遊べません（WebGL 2.0 が必要です）。新しい Chrome / Edge / Safari / Firefox でひらいてください。");
    }

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    const config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
      autoSyncPersistentDataPath: true,
    };

    // iPadOS の Safari は Mac と名乗るので、タッチ点の数でも判定する
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, mobile ? 2 : 2);

    // iOS のピンチ・ダブルタップ拡大やスクロールでページが動かないようにする
    const stop = (e) => e.preventDefault();
    document.addEventListener("gesturestart", stop, { passive: false });
    document.addEventListener("gesturechange", stop, { passive: false });
    document.addEventListener("dblclick", stop, { passive: false });
    document.addEventListener("touchmove", (e) => { if (e.touches.length > 1 || e.target === canvas) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener("touchend", (e) => {
      const now = Date.now();
      if (now - lastTouchEnd < 320) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    // iOS 13+ は、ふる・かたむけるセンサーに許可がいる（はじめてさわったときに頼む）
    function askMotion() {
      try {
        if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
          DeviceMotionEvent.requestPermission().catch(() => {});
        }
      } catch (e) {}
      document.removeEventListener("touchend", askMotion);
    }
    document.addEventListener("touchend", askMotion);

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        fill.style.width = (progress * 100) + "%";
        pct.textContent = Math.round(progress * 100) + "%";
      }).then(() => {
        clearInterval(tipTimer);
        loading.classList.add("done");
        setTimeout(() => loading.remove(), 900);
        canvas.focus();
      }).catch((message) => {
        showError("読み込みに失敗しました: " + message);
      });
    };
    document.body.appendChild(script);
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("pointerdown", () => canvas.focus());
  </script>
</body>
</html>
